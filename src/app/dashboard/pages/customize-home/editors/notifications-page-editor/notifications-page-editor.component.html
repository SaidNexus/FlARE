<div class="space-y-4">
    <div class="bg-card border border-border rounded-2xl overflow-hidden mb-4">
        <div class="p-4 bg-muted/30 border-b border-border font-medium">{{ 'DASHBOARD.AUTO_STR_186' | translate }}</div>
        <div class="p-4 space-y-4">
            <div class="space-y-3 p-4">
                <app-bilingual-input
                    title="عنوان الصفحة"
                    labelAr="عربي / AR"
                    labelEn="English / EN"
                    [valueAr]="config().pageTitleAr || config().pageTitle"
                    [valueEn]="config().pageTitleEn || ''"
                    (valueChange)="updateBilingualField('pageTitle', $event.lang, $event.value)"
                ></app-bilingual-input>

                <app-bilingual-input
                    title="نص الحالة الفارغة"
                    labelAr="عربي / AR"
                    labelEn="English / EN"
                    [valueAr]="config().emptyStateTitleAr || config().emptyStateTitle"
                    [valueEn]="config().emptyStateTitleEn || ''"
                    (valueChange)="updateBilingualField('emptyStateTitle', $event.lang, $event.value)"
                ></app-bilingual-input>
            </div>
        </div>
    </div>
</div>
