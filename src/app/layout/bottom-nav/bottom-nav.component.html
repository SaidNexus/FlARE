<nav class="fixed bottom-0 left-0 right-0 h-[56px] bg-white flex items-center justify-around shadow-[0_-2px_8px_rgba(0,0,0,0.06)] border-t border-[#f0e6df] z-[999] py-1 md:hidden">
  <div class="flex flex-row-reverse justify-around items-center w-full max-w-full">
    
    <!-- Cart Link -->
    <a 
      routerLink="/cart" 
      class="flex flex-col items-center justify-center flex-1 p-2 gap-1 no-underline relative transition-colors duration-200" 
      [ngClass]="isActive('/cart') ? 'text-flare-gold' : 'text-[#999999]'"
      aria-label="السلة"
    >
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" [attr.stroke-width]="isActive('/cart') ? 2.5 : 2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
      </svg>
      @if (appState.cartCount() > 0) {
        <span class="absolute top-0 right-6 bg-flare-red text-white rounded-full w-5 h-5 flex items-center justify-center text-[0.625rem] font-bold border-2 border-white">
          {{ appState.cartCount() }}
        </span>
      }
    </a>

    <!-- Favorites Link -->
    <a 
      routerLink="/favorites" 
      class="flex flex-col items-center justify-center flex-1 p-2 gap-1 no-underline relative transition-colors duration-200" 
      [ngClass]="isActive('/favorites') ? 'text-flare-gold' : 'text-[#999999]'"
      aria-label="المفضلة"
    >
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" [attr.stroke-width]="isActive('/favorites') ? 2.5 : 2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
      </svg>
    </a>

    <!-- Search Link -->
    <a 
      routerLink="/search" 
      class="flex flex-col items-center justify-center flex-1 p-2 gap-1 no-underline relative transition-colors duration-200" 
      [ngClass]="isActive('/search') ? 'text-flare-gold' : 'text-[#999999]'"
      aria-label="البحث"
    >
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" [attr.stroke-width]="isActive('/search') ? 2.5 : 2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
      </svg>
    </a>

    <!-- Categories Link -->
    <a 
      routerLink="/categories" 
      class="flex flex-col items-center justify-center flex-1 p-2 gap-1 no-underline relative transition-colors duration-200" 
      [ngClass]="isActive('/categories') ? 'text-flare-gold' : 'text-[#999999]'"
      aria-label="التصنيفات"
    >
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" [attr.stroke-width]="isActive('/categories') ? 2.5 : 2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
      </svg>
    </a>

    <!-- Home Link -->
    <a 
      routerLink="/" 
      class="flex flex-col items-center justify-center flex-1 p-2 gap-1 no-underline relative transition-colors duration-200" 
      [ngClass]="isActive('/') ? 'text-flare-gold' : 'text-[#999999]'"
      aria-label="الرئيسية"
    >
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" [attr.stroke-width]="isActive('/') ? 2.5 : 2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
      </svg>
    </a>
  </div>
</nav>
