@if (appState.toasts().length > 0) {
  <div
    class="fixed top-[calc(3.75rem+1rem)] md:top-[calc(4.5rem+1rem)] z-[9999] flex flex-col gap-2"
    [ngClass]="appState.dir() === 'rtl' ? 'left-4 sm:left-6' : 'right-4 sm:right-6'"
  >
    @for (toast of appState.toasts(); track toast.id) {
      <div class="flex items-start gap-3 bg-white border border-neutral-200 shadow-xl rounded-2xl px-4 py-3 min-w-64 max-w-sm animate-slide-up">
        <div class="mt-0.5 shrink-0">
          @switch (toast.type) {
            @case ('success') {
              <svg class="w-[18px] h-[18px] text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            }
            @case ('error') {
              <svg class="w-[18px] h-[18px] text-flare-red" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            }
            @case ('warning') {
              <svg class="w-[18px] h-[18px] text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
            }
            @default {
              <svg class="w-[18px] h-[18px] text-flare-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            }
          }
        </div>
        <p class="flex-1 text-sm text-neutral-900 m-0">{{ toast.message }}</p>
        <button
          type="button"
          (click)="dismiss(toast.id)"
          class="shrink-0 text-neutral-500 hover:text-neutral-900 transition-colors cursor-pointer border-none bg-transparent p-0"
          aria-label="إغلاق"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    }
  </div>
}
