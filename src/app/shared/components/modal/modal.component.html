@if (open()) {
  <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div
      class="absolute inset-0 bg-black/60 backdrop-blur-sm animate-fade-in"
      (click)="onBackdropClick()"
      aria-hidden="true"
    ></div>
    <div
      class="relative bg-white text-neutral-900 w-full rounded-t-3xl sm:rounded-2xl shadow-2xl animate-slide-up max-h-[90vh] overflow-y-auto"
      [ngClass]="[sizeClass, customClass()]"
      role="dialog"
      aria-modal="true"
    >
      @if (title()) {
        <div class="flex items-center justify-between px-5 pt-5 pb-4 border-b border-neutral-200 sticky top-0 bg-white z-10">
          <h3 class="font-bold text-lg text-slate-900 m-0">{{ title() }}</h3>
          <button
            type="button"
            (click)="onCloseClick()"
            class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-neutral-100 transition-colors cursor-pointer border-none bg-transparent"
            aria-label="إغلاق"
          >
            <svg class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      }
      <div class="p-5">
        <ng-content />
      </div>
    </div>
  </div>
}
