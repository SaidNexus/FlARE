<div
  class="group relative flex flex-col min-w-0 h-full overflow-hidden text-slate-900 border border-slate-200 rounded-2xl transition-all duration-170 hover:-translate-y-0.5 hover:shadow-[0_8px_24px_rgba(22,34,48,0.07)] hover:border-flare-gold/30"
  [ngClass]="bgColor()"
>
  @if (discount()) {
    <span class="absolute top-2 left-2 sm:top-[9px] sm:left-[9px] z-10 flex items-center h-[18px] sm:h-[22px] px-1.5 sm:px-[7px] text-[10px] font-extrabold text-white leading-none bg-flare-red rounded-full overflow-hidden after:absolute after:inset-0 after:-translate-x-full after:skew-x-[-20deg] after:bg-gradient-to-r after:from-transparent after:via-white/50 after:to-transparent after:animate-[lkHomeShineSweep_4.8s_0.9s_ease-in-out_infinite]">
      -{{ discount() }}%
    </span>
  }

  <button
    type="button"
    (click)="toggleFavorite($event)"
    class="absolute top-2 right-2 sm:top-[9px] sm:right-[9px] bg-white rounded-full cursor-pointer p-1.5 z-10 shadow-sm transition-colors border border-slate-100"
    [ngClass]="isFavorite ? 'text-flare-red border-flare-red/30' : 'text-slate-400 hover:text-flare-red hover:border-flare-red/30'"
    [attr.aria-label]="isFavorite ? (isEn ? 'Remove from wishlist' : 'إزالة من المفضلة') : (isEn ? 'Add to wishlist' : 'إضافة للمفضلة')"
  >
    <svg class="w-4 h-4" [attr.fill]="isFavorite ? 'currentColor' : 'none'" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
    </svg>
  </button>

  <a
    [routerLink]="id() ? ['/products', id()] : []"
    class="relative aspect-square w-full md:max-h-[220px] lg:max-h-[240px] bg-white overflow-hidden p-2 sm:p-3 md:p-3 flex items-center justify-center block no-underline"
  >
    <img
      [src]="cardImage"
      (error)="onImgError($event)"
      [alt]="displayTitle"
      class="w-full h-full object-contain transition-transform duration-200 group-hover:scale-105"
      loading="lazy"
    />
  </a>

  <a
    [routerLink]="id() ? ['/products', id()] : []"
    class="flex flex-col flex-1 px-2.5 sm:px-3 pt-2 pb-3.5 rtl:text-right no-underline"
  >
    <h3 class="m-0 mb-1 sm:mb-1.5 text-[12px] sm:text-[13px] font-bold text-slate-800 leading-[1.4] line-clamp-2">
      {{ displayTitle }}
    </h3>
    <div class="flex flex-wrap items-baseline gap-1 sm:gap-2 mb-1 sm:mb-1.5">
      <strong class="text-[clamp(13px,2.25vw,16px)] font-black text-slate-900 whitespace-nowrap">{{ price() }} {{ isEn ? 'SAR' : 'ر.س' }}</strong>
      @if (oldPrice()) {
        <del class="text-[clamp(9px,1.6vw,12px)] font-medium text-slate-400 whitespace-nowrap">{{ oldPrice() }} {{ isEn ? 'SAR' : 'ر.س' }}</del>
      }
    </div>
    <div class="flex items-center gap-1.5 mt-auto">
      <span class="flex text-yellow-400">
        @for (star of starArray; track star) {
          <svg
            class="w-3 h-3"
            [attr.fill]="star < rating() ? 'currentColor' : 'none'"
            viewBox="0 0 24 24"
            stroke="currentColor"
            [attr.stroke-width]="star < rating() ? 0 : 1.5"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
          </svg>
        }
      </span>
      <small class="text-[10px] font-medium text-slate-400">({{ rating() }})</small>
    </div>
  </a>

  <button
    type="button"
    (click)="onAddToCart($event)"
    class="absolute left-2 bottom-2 sm:left-2.5 sm:bottom-2.5 z-10 grid place-items-center w-[28px] h-[28px] sm:w-[32px] sm:h-[32px] text-white bg-slate-900 border-none rounded-full cursor-pointer transition-all hover:bg-flare-gold focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-flare-gold/50 shadow-sm"
    [attr.aria-label]="isEn ? 'Add ' + displayTitle + ' to cart' : 'أضف ' + displayTitle + ' إلى السلة'"
  >
    <svg class="w-4 h-4 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
    </svg>
  </button>
</div>
