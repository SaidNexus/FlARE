@switch (type()) {
  @case ('box') {
    <div class="skeleton" [ngClass]="customClass()"></div>
  }
  @case ('product-card') {
    <div class="bg-white rounded-2xl overflow-hidden border border-neutral-200">
      <div class="skeleton w-full aspect-[3/4]"></div>
      <div class="p-3 space-y-2">
        <div class="skeleton h-4 w-3/4"></div>
        <div class="skeleton h-4 w-1/2"></div>
        <div class="flex justify-between items-center pt-1">
          <div class="skeleton h-5 w-16"></div>
          <div class="skeleton h-8 w-8 rounded-full"></div>
        </div>
      </div>
    </div>
  }
  @case ('order-card') {
    <div class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-3">
      <div class="flex justify-between">
        <div class="skeleton h-4 w-32"></div>
        <div class="skeleton h-6 w-20 rounded-full"></div>
      </div>
      <div class="skeleton h-3 w-24"></div>
      <div class="skeleton h-3 w-full"></div>
      <div class="skeleton h-3 w-2/3"></div>
    </div>
  }
  @case ('grid') {
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4" [ngClass]="customClass()">
      @for (item of countArray; track item) {
        <div class="bg-white rounded-2xl overflow-hidden border border-neutral-200">
          <div class="skeleton w-full aspect-[3/4]"></div>
          <div class="p-3 space-y-2">
            <div class="skeleton h-4 w-3/4"></div>
            <div class="skeleton h-4 w-1/2"></div>
            <div class="flex justify-between items-center pt-1">
              <div class="skeleton h-5 w-16"></div>
              <div class="skeleton h-8 w-8 rounded-full"></div>
            </div>
          </div>
        </div>
      }
    </div>
  }
  @case ('table-row') {
    <tr>
      @for (col of [1,2,3,4,5]; track col) {
        <td class="px-4 py-3">
          <div class="skeleton h-4 w-full"></div>
        </td>
      }
    </tr>
  }
}
