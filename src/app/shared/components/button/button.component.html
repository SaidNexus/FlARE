<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  class="inline-flex items-center justify-center gap-2 transition-all duration-150 select-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-flare-gold disabled:opacity-50 disabled:pointer-events-none"
  [ngClass]="[variantClass, sizeClass, fullWidth() ? 'w-full' : '', customClass()]"
>
  @if (loading()) {
    <span class="inline-block w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin" aria-hidden="true"></span>
  }
  <ng-content select="[leftIcon]" />
  <ng-content />
  @if (!loading()) {
    <ng-content select="[rightIcon]" />
  }
</button>
