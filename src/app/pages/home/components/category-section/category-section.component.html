<section class="w-full max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 pt-7 sm:pt-10 pb-4 sm:pb-6"
  aria-labelledby="categories-heading">
  @if (showTitle) {
  <div class="flex items-end justify-between mb-4 sm:mb-6 pb-2.5 sm:pb-3 border-b border-slate-100/80">
    <div class="flex flex-col">
      <span class="text-[11px] sm:text-xs font-bold tracking-wider uppercase text-flare-gold mb-1">{{ isEn ? 'Featured
        Collections' : 'تشكيلاتنا المميزة' }}</span>
      <h2 id="categories-heading" class="text-lg sm:text-2xl lg:text-3xl font-black text-slate-900 m-0">{{ title }}</h2>
    </div>
    <a routerLink="/categories"
      class="inline-flex items-center gap-1.5 px-3 py-1.5 sm:px-4 sm:py-2 text-xs sm:text-sm font-bold text-slate-700 hover:text-flare-gold bg-white hover:bg-amber-50/40 border border-slate-200/80 hover:border-flare-gold/40 rounded-full transition-all duration-200 shadow-sm group no-underline">
      <span>{{ isEn ? 'See All' : 'عرض الكل' }}</span>
      <svg
        class="w-3.5 h-3.5 transition-transform rtl:rotate-0 ltr:rotate-180 rtl:group-hover:-translate-x-1 ltr:group-hover:translate-x-1"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </a>
  </div>
  }

  <div class="grid grid-cols-4 gap-2.5 sm:gap-4 md:gap-5 lg:gap-6">
    @for (category of categories; track category.id; let index = $index) {
    <a [routerLink]="category.path"
      class="group flex flex-col items-center p-2 sm:p-3 md:p-4 lg:p-5 bg-white rounded-2xl sm:rounded-3xl border border-slate-100/90 shadow-[0_4px_20px_rgba(0,0,0,0.03)] hover:shadow-[0_12px_35px_rgba(190,144,72,0.12)] hover:border-flare-gold/40 hover:-translate-y-1.5 transition-all duration-300 no-underline">
      <span
        class="relative w-full aspect-[4/3] sm:h-24 md:h-32 lg:h-36 overflow-hidden bg-gradient-to-b from-slate-50/80 to-slate-100/40 group-hover:from-amber-50/40 group-hover:to-amber-50/10 rounded-xl sm:rounded-2xl p-2 sm:p-3 flex items-center justify-center transition-colors duration-300">
        <img [src]="category.image" (error)="onImgError($event)" [alt]="category.label"
          class="w-full h-full object-contain transition-transform duration-500 ease-out group-hover:scale-110"
          width="900" height="520" loading="lazy" decoding="async" />
      </span>
      <strong
        class="text-slate-800 group-hover:text-flare-gold font-bold text-xs sm:text-sm md:text-base lg:text-lg text-center leading-tight transition-colors mt-2 sm:mt-3 whitespace-nowrap">{{
        category.label }}</strong>
    </a>
    }
  </div>
</section>
