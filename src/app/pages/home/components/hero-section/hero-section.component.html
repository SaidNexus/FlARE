<section class="w-full max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 pt-2 sm:pt-4 lg:pt-6" aria-label="Hero Banner">
  <div
    class="relative w-full h-full overflow-hidden rounded-2xl sm:rounded-3xl lg:rounded-[2rem] border border-slate-100/80 shadow-[0_15px_45px_rgba(15,23,42,0.06)] bg-white transition-all duration-500 hover:shadow-[0_22px_60px_rgba(15,23,42,0.10)]">
    <img [src]="heroImage" (error)="onImgError($event)" alt="FLARE Hero Banner" class="w-full h-auto block object-cover"
      loading="eager" fetchpriority="high" decoding="async" />
  </div>
</section>
