<section class="w-full max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 pt-7 sm:pt-10 pb-4 sm:pb-6" aria-labelledby="best-sellers-heading">
  @if (showTitle) {
    <div class="flex items-end justify-between mb-4 sm:mb-6 pb-2.5 sm:pb-3 border-b border-slate-100/80">
      <div class="flex flex-col">
        <span class="text-[11px] sm:text-xs font-bold tracking-wider uppercase text-flare-gold mb-1">{{ isEn ? 'Top Rated & Most Popular' : 'الأعلى طلباً وتقييماً' }}</span>
        <h2 id="best-sellers-heading" class="text-lg sm:text-2xl lg:text-3xl font-black text-slate-900 m-0">{{ title }}</h2>
      </div>
      <a
        routerLink="/products"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 sm:px-4 sm:py-2 text-xs sm:text-sm font-bold text-slate-700 hover:text-flare-gold bg-white hover:bg-amber-50/40 border border-slate-200/80 hover:border-flare-gold/40 rounded-full transition-all duration-200 shadow-sm group no-underline"
      >
        <span>{{ isEn ? 'See All' : 'عرض الكل' }}</span>
        <svg class="w-3.5 h-3.5 transition-transform rtl:rotate-0 ltr:rotate-180 rtl:group-hover:-translate-x-1 ltr:group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </a>
    </div>
  }

  <div class="flex overflow-x-auto pb-4 pt-1 -mx-2 px-2 snap-x snap-proximity scrollbar-hide gap-3 sm:grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 sm:gap-4 md:gap-5 lg:gap-6">
    @for (product of products; track product.id; let index = $index) {
      <div
        class="w-[160px] flex-none sm:w-auto snap-start"
      >
        <app-home-product-card [item]="product"></app-home-product-card>
      </div>
    }
  </div>
</section>
